name: Update prices
on:
  schedule:
    - cron: '17 3 * * *'     # every day at 03:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch-prices.mjs
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "Update prices" && git push)
